[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "py-term"
dynamic = ["version"]
description = "A modern, beautiful interactive Python shell — IPython's power with a calm terminal UI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur D'Aquino", email = "arthurdaquinosilva@gmail.com" }]
keywords = ["repl", "shell", "ipython", "interactive", "terminal", "tui", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Interpreters",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
]
dependencies = [
    "prompt_toolkit>=3.0.43",
    "rich>=13.8",
    "jedi>=0.19",
    "pygments>=2.21.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pyte", "pexpect", "ruff==0.16.4", "mypy==2.4.1", "pre-commit", "build"]  # linters pinned so CI and local runs agree
trio = ["trio"]
curio = ["curio"]

[project.urls]
Homepage = "https://github.com/arthurdaquinosilva/py-term"
Documentation = "https://github.com/arthurdaquinosilva/py-term/tree/main/docs"
Issues = "https://github.com/arthurdaquinosilva/py-term/issues"
Changelog = "https://github.com/arthurdaquinosilva/py-term/blob/main/CHANGELOG.md"

[project.scripts]
":py" = "py_term.cli:main"
py-term = "py_term.cli:main"

[tool.setuptools.dynamic]
version = { attr = "py_term.__version__" }  # the one place the version is set

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are left to the formatter
    "E731",    # small lambdas assigned to names are fine
    "SIM105",  # contextlib.suppress isn't clearer than try/except/pass
    "SIM103", "SIM108",  # explicit if/else reads better in places
    "SIM115",  # some files (logs, devnull consoles) are kept open on purpose
    "B905",    # zip() over sequences known to match
    "RUF005",
    "RUF001", "RUF002", "RUF003",  # the UI uses typographic characters on purpose
]

[tool.ruff.lint.isort]
known-first-party = ["py_term"]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
python_version = "3.10"
files = ["src/py_term"]
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# optional integrations, imported lazily only when the user already has them
module = ["numpy.*", "pandas.*", "polars.*", "matplotlib.*", "IPython.*", "trio.*", "curio.*", "PIL.*"]
follow_imports = "skip"
follow_untyped_imports = false

[tool.setuptools.package-data]
py_term = ["py.typed"]

[tool.coverage.run]
source = ["py_term"]
branch = true

[tool.coverage.report]
# 60% (lines and branches) on 2026-11-19, a little higher without IPython installed; raise as tests are added
fail_under = 58
skip_covered = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
