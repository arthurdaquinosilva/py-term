name: release

# Push a vX.Y.Z tag to publish a GitHub release with the wheel, the sdist,
# SHA256SUMS (checked by install.sh) and build provenance attestations.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Check
        run: |
          python scripts/release_notes.py "$GITHUB_REF_NAME" > /dev/null
          ruff check src tests scripts
          mypy
          python -m pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build
          python -m build
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/:py --version
          /tmp/smoke/bin/:py -c "assert 1 + 1 == 2"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
