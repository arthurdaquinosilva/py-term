version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Only the linters pinned in the dev extras. Runtime dependencies keep low minimums on
    # purpose (see docs/releasing.md), so Dependabot must not raise them.
    allow:
      - dependency-name: ruff
      - dependency-name: mypy
